# Render Blueprint. Both services build the same Dockerfile; the worker only
# swaps the command. Values marked `sync: false` are filled in from the Render
# dashboard so no secret is committed here.
envVarGroups:
  - name: tasku-shared
    envVars:
      - key: APP_NAME
        value: Tasku
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # php artisan key:generate --show
      - key: APP_URL
        sync: false # https://<service>.onrender.com, or the custom domain
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: id_ID
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false # Neon pooled connection string
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "480"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: SAP_CDS_URL
        value: http://43.218.20.129/dev/get_cds.php
      - key: SAP_CDS_TIMEOUT
        value: "180"
      - key: SAP_USER
        sync: false
      - key: SAP_PASS
        sync: false

services:
  - type: web
    name: tasku
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: commit
    # Runs once per deploy, before the new instances take traffic.
    preDeployCommand: php artisan migrate --force
    envVars:
      - fromGroup: tasku-shared

  - type: worker
    name: tasku-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    # Queue plus the daily commands in routes/console.php.
    dockerCommand: worker.sh
    envVars:
      - fromGroup: tasku-shared
